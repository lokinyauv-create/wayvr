[package]
name = "dash-frontend"
version = "0.1.0"
edition = "2024"
description = "The dashboard frontend for WayVR"
license = "GPL-3.0-only"
authors = ["galister", "oo8dev"]
repository = "https://github.com/wlx-team/wayvr"

[dependencies]
wgui = { path = "../wgui/", default-features = false }  # no video: only the removed welcome tab used it
wlx-common = { path = "../wlx-common" }

anyhow.workspace = true
chrono.workspace = true
glam = { workspace = true, features = ["mint", "serde"] }
log.workspace = true
rust-embed.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
strum.workspace = true
xdg.workspace = true

