[package]
name = "wayvr"
version = "26.8.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["galister", "oo8dev"]
description = "Your way to enjoy VR on Linux! Access your Wayland/X11 desktop from Monado/WiVRn/SteamVR."
repository = "https://github.com/wlx-team/wayvr"
keywords = [
  "linux",
  "openvr",
  "openvr-overlay",
  "openxr",
  "openxr-overlay",
  "wayland",
  "x11",
]
categories = ["games"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dash-frontend = { path = "../dash-frontend/" }
wayvr-ipc = { path = "../wayvr-ipc", default-features = false }
wgui = { path = "../wgui", default-features = false }
wlx-capture = { path = "../wlx-capture" }
wlx-common = { path = "../wlx-common" }

anyhow.workspace = true
chrono = { workspace = true, features = ["unstable-locales"] }
clap.workspace = true
dbus.workspace = true
glam = { workspace = true, features = ["mint", "serde"] }
idmap = { workspace = true, features = ["serde"] }
idmap-derive.workspace = true
input = {
  version = "0.9.1",
  default-features = false,
  features = ["libinput_1_19", "udev"]
}
interprocess.workspace = true
libc.workspace = true
log.workspace = true
regex.workspace = true
rust-embed.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_json5.workspace = true
slotmap.workspace = true
smallvec.workspace = true
smol = { workspace = true }
strum.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true }
vulkano.workspace = true
vulkano-shaders.workspace = true
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-misc = { workspace = true }
winit = { workspace = true, optional = true }
xdg.workspace = true

ash = "^0.38.0"  # must match vulkano
bytes = { workspace = true }
chrono-tz = "0.10.4"
config = "0.15.25"
futures = "0.3.32"
input-linux = "0.7.1"
json = { version = "0.12.4", optional = true }
json5 = "1.3.1"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
ovr_overlay = {
  git = "https://github.com/galister/ovr_overlay_oyasumi",
  rev = "e477bd2a9e04293ea68c1e7529ef2cb131f32acc",
  features = [
    "ovr_input",
    "ovr_system",
  ],
  optional = true
}
pure-rust-locales = "0.8.2"
serde_yaml = "0.9.33"
signal-hook = "0.4.4"
smithay = {
  version = "0.7.0",
  default-features = false,
  features = [
    "backend_vulkan",
    "desktop",
    "wayland_frontend",
    "xwayland",
  ]
}
sysinfo = { version = "0.39.6" }
thiserror = "2.0.18"
tracing = "0.1.44"
xcb = {
  version = "1.7.0",
  features = [
    "as-raw-xcb-connection",
  ],
  optional = true
}
xkbcommon = {
  version = "0.8.0"
}  # 0.9.0 breaks keymap import on some distros

evdev = "0.13.2"

[build-dependencies]
regex.workspace = true

[features]
default = ["openvr", "wayland", "x11"]
as-raw-xcb-connection = []
openvr = ["dep:json", "dep:ovr_overlay"]
pipewire = ["wlx-capture/pipewire"]
uidev = ["dep:winit"]
wayland = ["pipewire", "wlx-capture/wlr", "xkbcommon/wayland"]
x11 = ["dep:xcb", "wlx-capture/xshm", "xkbcommon/x11"]
xcb = ["dep:xcb"]
